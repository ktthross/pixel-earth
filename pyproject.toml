[project]
name = "pixel-earth"
version = "0.1.0"
description = "Select and crop the Earth out of an image"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gradio>=5",
    "httpx>=0.28",
    "numpy>=2",
    "pillow>=11",
    "scipy>=1.14",
]

[project.scripts]
pixel-earth = "pixel_earth.app:main"
pixel-earth-batch = "pixel_earth.batch:main"
pixel-earth-fetch = "pixel_earth.epic:main"
pixel-earth-turntable = "pixel_earth.turntable:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_earth"]

[tool.pytest.ini_options]
# Live tests hit epic.gsfc.nasa.gov; deselected by default so the suite stays
# hermetic and fast. Run them with: pytest -m network
addopts = "-m 'not network'"
markers = ["network: touches the real EPIC archive over the internet"]
